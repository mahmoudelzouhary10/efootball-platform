# Local development services. The API and web app run on the host (pnpm dev).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: efp
      POSTGRES_PASSWORD: efp
      POSTGRES_DB: efp_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U efp']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailpit:
    # Catches all outgoing email in development: http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
