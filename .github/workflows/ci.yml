name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: efp
          POSTGRES_PASSWORD: efp
          POSTGRES_DB: efp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U efp" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @efp/contracts build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are in sync with the schema
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run pnpm --filter @efp/api db:generate."
            git status --porcelain drizzle
            exit 1
          fi
      - run: pnpm build
